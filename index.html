<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Attrition Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="main-container">
        <!-- Header -->
        <header>
            <h1>Employee Attrition Prediction</h1>
        </header>

        <!-- Form Card -->
        <div class="form-card">
            <form method="POST" action="/predict">
                <div class="form-grid">
                    {% for feature in feature_names %}
                        <label>{{ feature }}:
                            <input type="number" step="any" name="{{ feature }}" required>
                        </label>
                    {% endfor %}
                </div>
                <button type="submit">Predict</button>
            </form>
        </div>

        <!-- Prediction Result -->
        {% if prediction_text %}
        <footer>
            <div class="prediction">{{ prediction_text }}</div>
        </footer>
        {% endif %}
    </div>
</body>
</html>
